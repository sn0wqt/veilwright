[project]
name = "defender"
version = "0.1.0"
description = "The Defender agent — semantic text anonymization for adversarial multi-agent PII protection."
authors = [
    {name = "Asaad Falah Rasul", email = "asadfalah2@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.15.0",
    "phonenumbers>=9.0.23",
    "spacy>=3.8.13",
]

[project.scripts]
defender = "defender.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defender"]
