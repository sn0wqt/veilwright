name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Force supported Copilot model
        run: |
          echo "COPILOT_MODEL=gpt-4.1" >> "$GITHUB_ENV"
          echo "COPILOT_AGENT_MODEL=gpt-4.1" >> "$GITHUB_ENV"
